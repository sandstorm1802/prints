<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0f">
<title>Sandstorm's 3D Prints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f; --panel: #17171b; --panel-2: #202026; --line: #2c2c33;
    --orange: #ff7a1a; --orange-soft: #ffa25c; --text: #f3efe9; --muted: #9a958e;
    --bad: #ff5a5a;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: radial-gradient(120% 50% at 50% 0%, rgba(255,122,26,.14), transparent 60%), var(--bg);
    color: var(--text); font-family: 'Poppins', system-ui, sans-serif;
    min-height: 100vh; padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { text-align: center; margin: 8px 0 22px; }
  header h1 { font-weight: 800; font-size: 1.9rem; line-height: 1.05; }
  header .sub { margin-top: 4px; color: var(--orange); font-weight: 700; letter-spacing: .32em; font-size: .78rem; padding-left: .32em; }
  .kids-badge { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 99px; background: var(--orange); color: #1a1004; font-weight: 700; font-size: .8rem; }
  .card {
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px 18px;
  }
  .step-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: .95rem; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
  .item {
    appearance: none; border: 1.5px solid var(--line); background: var(--panel-2); color: var(--text);
    border-radius: 16px; padding: 0; text-align: left; font: inherit; cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column; transition: border-color .15s, transform .1s;
  }
  .item:active { transform: scale(.98); }
  .item.sel { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(255,122,26,.35); }
  .thumb { aspect-ratio: 1; background: #26262c; display: grid; place-items: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 42%; opacity: .55; }
  .item .nm { font-weight: 700; font-size: 1rem; padding: 10px 12px 2px; }
  .item .ds { color: var(--muted); font-size: .8rem; line-height: 1.35; padding: 0 12px 12px; }
  .colors { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .chip {
    appearance: none; font: inherit; color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px 9px 10px;
    border-radius: 99px; border: 1.5px solid var(--line); background: var(--panel-2); font-weight: 600;
  }
  .chip .sw { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); }
  .chip.sel { border-color: var(--orange); background: rgba(255,122,26,.14); }
  .btn {
    appearance: none; border: 0; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer;
    width: 100%; padding: 15px; border-radius: 14px; margin-top: 18px;
    background: var(--orange); color: #1a1004;
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
  .back { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; padding: 4px 0; margin-bottom: 10px; }
  input.code {
    width: 100%; margin-top: 16px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; font-size: 1.4rem; font-weight: 700;
    text-align: center; letter-spacing: .2em; text-transform: uppercase;
  }
  input.code:focus { outline: none; border-color: var(--orange); }
  .err { color: var(--bad); font-weight: 600; font-size: .92rem; margin-top: 12px; min-height: 1.2em; }
  .picked { display: flex; gap: 14px; align-items: center; margin: 4px 0 6px; }
  .picked .thumb { width: 64px; border-radius: 12px; overflow: hidden; flex: none; }
  .done { text-align: center; }
  .done .lbl { color: var(--muted); font-weight: 600; letter-spacing: .12em; font-size: .8rem; text-transform: uppercase; }
  .done .num { font-weight: 800; font-size: 5.2rem; line-height: 1; color: var(--orange); margin: 6px 0 4px; letter-spacing: -.02em; }
  .done .what { font-weight: 700; font-size: 1.15rem; }
  .done .note { margin-top: 16px; }
  .shot { margin-top: 18px; padding: 12px; border-radius: 12px; background: rgba(255,122,26,.1); color: var(--orange-soft); font-weight: 600; font-size: .92rem; }
  .mine { margin-bottom: 14px; }
  .mine .card { padding: 16px 16px 8px; }
  .mine h2 { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: 0; }
  .mrow .mn { font-weight: 800; color: var(--orange); font-size: 1.15rem; min-width: 52px; }
  .mrow .mw { flex: 1; font-weight: 600; font-size: .92rem; line-height: 1.3; }
  .pill { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .p-requested { background: #26262c; color: var(--muted); }
  .p-printing { background: rgba(91,157,255,.15); color: #7fb2ff; }
  .p-ready { background: #3ccf7a; color: #062b14; }
  .p-picked_up, .p-cancelled { background: #1d1d22; color: #6f6b65; }
  .mrow.ready { margin: 0 -10px; padding: 12px 10px; border-radius: 12px; background: rgba(60,207,122,.1); border-top-color: transparent; }
  .busy { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 9px 12px; border-radius: 12px; background: rgba(60,207,122,.1); color: #bfeccf; font-size: .9rem; line-height: 1.35; }
  .busy strong { color: #3ccf7a; }
  .busy .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ccf7a; flex: none; box-shadow: 0 0 0 4px rgba(60,207,122,.18); }
  .busy.warm { background: rgba(255,122,26,.12); color: #ffd2a8; }
  .busy.warm strong { color: var(--orange); }
  .busy.warm .dot { background: var(--orange); box-shadow: 0 0 0 4px rgba(255,122,26,.2); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255,122,26,.05); } }
  @media (prefers-reduced-motion: reduce) { .busy.warm .dot { animation: none; } }
  .stabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .stab { appearance: none; font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer; white-space: nowrap; padding: 8px 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--panel-2); color: var(--muted); }
  .stab.on { border-color: var(--orange); background: rgba(255,122,26,.14); color: var(--text); }
  .early { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,122,26,.1); color: var(--orange-soft); font-weight: 600; font-size: .9rem; line-height: 1.4; }
  .early strong { color: var(--text); }
  .mrow .due { color: var(--orange-soft); font-size: .78rem; font-weight: 600; margin-top: 2px; }
  .yay { margin: -2px 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--orange); color: #1a1004; font-weight: 800; text-align: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .done .num { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
  .linkbox { margin-top: 10px; display: flex; gap: 8px; }
  .linkbox .btn { margin-top: 0; }
  .privacy { text-align: center; color: #6f6b65; font-size: .78rem; margin-top: 22px; line-height: 1.5; }
  .center { text-align: center; }
  .spinner { width: 34px; height: 34px; margin: 30px auto; border-radius: 50%; border: 3px solid #2c2c33; border-top-color: var(--orange); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sandstorm&rsquo;s</h1>
    <div class="sub">3D PRINTS</div>
    <div class="kids-badge" id="kidsBadge" hidden>Kids&rsquo; picks</div>
  </header>

  <section class="mine" id="mine" hidden></section>
  <main id="app"><div class="spinner" aria-label="Loading"></div></main>

  <p class="privacy">No names, no sign-up, nothing personal collected.<br>Just pick something fun.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://xmsfnoloijgvtlfvzmyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-BiThUOZZrxtoWV8T4eb6Q_1mOnfGWp';
const DEVICE_DAILY_MAX = 3;

const params = new URLSearchParams(location.search);
const SOURCE = params.get('for') === 'kids' ? 'kids' : 'office';
if (SOURCE === 'kids') document.getElementById('kidsBadge').hidden = false;

const app = document.getElementById('app');
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } }) : null;

const S = { state: null, items: [], colors: [], sections: [], tab: '', code: '', item: null, color: null };
const dueText = d => d ? new Date(d + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
const sectionOf = it => it && it.section ? S.sections.find(x => x.name === it.section) : null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cube = '<svg viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>';
const thumb = it => `<div class="thumb">${it.photo_url ? `<img src="${esc(it.photo_url)}" alt="" loading="lazy">` : cube}</div>`;

// ---------- confetti ----------
function confetti(big) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
  document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#ff7a1a', '#ffa25c', '#ffd2a8', '#f3efe9', '#3ccf7a', '#ff5a1f'];
  const N = big ? 170 : 110;
  const P = [...Array(N)].map((_, i) => {
    const fromLeft = i % 2 === 0;
    return {
      x: fromLeft ? -10 : W + 10, y: H * (0.55 + Math.random() * 0.3),
      vx: (fromLeft ? 1 : -1) * (5 + Math.random() * 7), vy: -(9 + Math.random() * 9),
      w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
      col: cols[i % cols.length], round: Math.random() < .3,
    };
  });
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0;
    g.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += 0.32; p.vx *= 0.99; p.vy *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.globalAlpha = Math.max(0, 1 - Math.max(0, el - 2200) / 800);
      g.fillStyle = p.col;
      if (p.round) { g.beginPath(); g.arc(0, 0, p.h, 0, 6.28); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    });
    if (el < 3000) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
const cheeredMem = new Set();
function getCheered() { let l = []; try { l = JSON.parse(localStorage.getItem('sp-cheered') || '[]'); } catch {} return [...new Set([...l, ...cheeredMem])]; }
function setCheered(l) { l.forEach(x => cheeredMem.add(x)); try { localStorage.setItem('sp-cheered', JSON.stringify(l.slice(-20))); } catch {} }

// ---------- "your prints": this phone remembers its own requests ----------
const STATUS_TEXT = { requested: 'Waiting to print', printing: 'Printing now', ready: 'Ready for pickup!', picked_up: 'Picked up', cancelled: 'Cancelled' };
function getMine() { try { return JSON.parse(localStorage.getItem('sp-mine') || '[]'); } catch { return []; } }
function setMine(list) { try { localStorage.setItem('sp-mine', JSON.stringify(list.slice(0, 10))); } catch {} }
function addClaim(claim) {
  if (!claim || claim.length < 20) return;
  setMine([claim, ...getMine().filter(c => c !== claim)]);
}
const linkFor = claim => location.origin + location.pathname + '?r=' + encodeURIComponent(claim);
// a saved status link (?r=...) adds that request to this phone, then tidies the address bar
if (params.get('r')) {
  addClaim(params.get('r'));
  params.delete('r');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
}
async function loadMine() {
  const claims = getMine();
  const box = document.getElementById('mine');
  if (!claims.length || !db) { box.hidden = true; return; }
  const { data, error } = await db.rpc('get_status', { p_claims: claims });
  if (error || !Array.isArray(data)) return;
  const week = 7 * 864e5;
  const keep = data.filter(r => !((r.status === 'picked_up' || r.status === 'cancelled') && Date.now() - new Date(r.updated_at) > week));
  setMine(keep.map(r => r.claim));
  if (!keep.length) { box.hidden = true; return; }
  const order = { ready: 0, printing: 1, requested: 2, picked_up: 3, cancelled: 4 };
  keep.sort((a, b) => order[a.status] - order[b.status]);
  box.innerHTML = `<div class="card"><h2>Your prints</h2>${keep.map(r => `
    <div class="mrow${r.status === 'ready' ? ' ready' : ''}">
      <div class="mn">#${String(r.pickup_no).padStart(3, '0')}</div>
      <div class="mw">${esc(r.item_name)} &middot; ${esc(r.color)}${r.ready_by && (r.status === 'requested' || r.status === 'printing') ? `<div class="due">Ready by ${esc(dueText(r.ready_by))}</div>` : ''}</div>
      <span class="pill p-${esc(r.status)}">${STATUS_TEXT[r.status] || esc(r.status)}</span>
    </div>`).join('')}</div>`;
  box.hidden = false;
  // celebrate the first time this phone sees a print turn ready
  const cheered = getCheered();
  const fresh = keep.filter(r => r.status === 'ready' && !cheered.includes(r.claim));
  if (fresh.length) {
    setCheered([...cheered, ...fresh.map(r => r.claim)]);
    box.querySelector('.card').insertAdjacentHTML('afterbegin', `<div class="yay">&#127881; Your ${esc(fresh[0].item_name)} is ready!</div>`);
    confetti(true);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadMine(); });
setInterval(() => { if (!document.hidden) loadMine(); }, 60000);

// soft per-device limit (the database has the real limit)
function todayKey() { return 'sp-count-' + new Date().toISOString().slice(0, 10); }
function deviceCount() { try { return +localStorage.getItem(todayKey()) || 0; } catch { return 0; } }
function bumpDevice() { try { localStorage.setItem(todayKey(), deviceCount() + 1); } catch {} }

function message(title, body, retry) {
  app.innerHTML = `<div class="card center"><div class="step-title">${esc(title)}</div><p class="hint" style="margin-top:6px">${esc(body)}</p>${retry ? '<button class="btn ghost" id="retry">Try again</button>' : ''}</div>`;
  if (retry) document.getElementById('retry').onclick = start;
}

async function start() {
  app.innerHTML = '<div class="spinner" aria-label="Loading"></div>';
  loadMine();
  if (!db) return message('Hmm, something didn’t load', 'Check your connection and try again.', true);
  const [st, it, co, se] = await Promise.all([
    db.rpc('get_public_state'),
    db.from('catalog_items').select('*').order('sort_order', { ascending: true }),
    db.from('colors').select('name,hex,sort_order').order('sort_order', { ascending: true }),
    db.from('sections').select('name,emoji,ready_by,sort_order').order('sort_order', { ascending: true }),
  ]);
  if (st.error || it.error || co.error) return message('Hmm, something didn’t load', 'Check your connection and try again.', true);
  S.state = st.data; S.colors = co.data || [];
  S.sections = se.error ? [] : (se.data || []);
  // items in hidden holiday sections aren't offered
  S.items = (it.data || []).filter(i => !i.section || S.sections.some(x => x.name === i.section));
  S.sections = S.sections.filter(x => S.items.some(i => i.section === x.name));
  if (!S.state.accepting) return message(S.state.full ? 'All booked up!' : 'Taking a break', S.state.closed_message);
  // queue has room but today's limit is used up
  if (S.state.spots_left === 0) return message('All booked up for today!', 'That\u2019s all the requests for today. Check back tomorrow.');
  if (deviceCount() >= DEVICE_DAILY_MAX) return message('That’s a lot of prints!', 'You’ve made a few picks today. Come back another day for more.');
  if (!S.items.length || !S.colors.length) return message('Catalog coming soon', 'New prints are being added. Check back soon!');
  if (S.state.code_required && !S.code) return showCode();
  showCatalog();
}

function showCode(err) {
  app.innerHTML = `
    <div class="card">
      <div class="step-title">Enter the code</div>
      <p class="hint">You&rsquo;ll find it on the card by the sign.</p>
      <input class="code" id="code" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(S.code)}">
      <div class="err" id="err">${esc(err || '')}</div>
      <button class="btn" id="go">Continue</button>
    </div>`;
  const inp = document.getElementById('code');
  const go = () => { S.code = inp.value.trim(); if (!S.code) return; showCatalog(); };
  document.getElementById('go').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
}

function waitText(days) {
  if (days == null) return '';
  if (days < 2) return 'Prints ready in a day or two';
  if (days < 4) return 'Prints ready in a few days';
  if (days < 10) return 'Prints ready in about a week';
  if (days < 18) return 'Prints ready in about 2 weeks';
  return `Prints ready in about ${Math.round(days / 7)} weeks`;
}
function busyLine() {
  const st = S.state;
  if (!st || typeof st.spots_left !== 'number') return '';
  const wait = waitText(st.typical_days);
  if (st.spots_left <= 3) {
    const n = st.spots_left;
    return `<div class="busy warm"><span class="dot"></span><span><strong>Getting busy.</strong> ${n} spot${n === 1 ? '' : 's'} left${wait ? ' &middot; ' + esc(wait.toLowerCase()) : ''}</span></div>`;
  }
  return `<div class="busy"><span class="dot"></span><span><strong>Plenty of room.</strong>${wait ? ' ' + esc(wait) + '.' : ''}</span></div>`;
}

function showCatalog() {
  if (S.tab && !S.sections.some(x => x.name === S.tab)) S.tab = '';
  const everyday = S.items.filter(i => !i.section);
  if (!S.tab && !everyday.length && S.sections.length) S.tab = S.sections[0].name;
  const sec = S.sections.find(x => x.name === S.tab);
  const shown = S.items.filter(i => (i.section || '') === S.tab);
  const tabs = S.sections.length ? `<div class="stabs">
      ${everyday.length ? `<button class="stab${S.tab ? '' : ' on'}" data-t="">Everyday</button>` : ''}
      ${S.sections.map(x => `<button class="stab${S.tab === x.name ? ' on' : ''}" data-t="${esc(x.name)}">${esc(x.emoji || '')} ${esc(x.name)}</button>`).join('')}
    </div>` : '';
  app.innerHTML = `
    <div class="card">
      <div class="step-title">Pick a free print</div>
      <p class="hint">Tap the one you want.</p>
      ${busyLine()}
      ${tabs}
      ${sec ? `<div class="early">${esc(sec.emoji || '')} Request early! ${sec.ready_by ? `These will be ready by <strong>${esc(dueText(sec.ready_by))}</strong>.` : 'Holiday prints are made ahead of time.'}</div>` : ''}
      <div class="grid">${shown.map(it => `
        <button class="item${S.item && S.item.id === it.id ? ' sel' : ''}" data-id="${it.id}">
          ${thumb(it)}<div class="nm">${esc(it.name)}</div>${it.description ? `<div class="ds">${esc(it.description)}</div>` : '<div class="ds"></div>'}
        </button>`).join('')}
      </div>
    </div>`;
  app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    S.item = S.items.find(i => i.id === +b.dataset.id);
    showColor();
  });
  app.querySelectorAll('.stab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; showCatalog(); });
}

function showColor(err) {
  app.innerHTML = `
    <div class="card">
      <button class="back" id="back">&larr; Back</button>
      <div class="picked">${thumb(S.item)}<div><div class="step-title">${esc(S.item.name)}</div><p class="hint">Now pick a color.</p></div></div>
      <div class="colors">${S.colors.map(c => `
        <button class="chip${S.color === c.name ? ' sel' : ''}" data-c="${esc(c.name)}"><span class="sw" style="background:${esc(c.hex)}"></span>${esc(c.name)}</button>`).join('')}
      </div>
      <div class="err" id="err">${esc(err || '')}</div>
      <button class="btn" id="send" ${S.color ? '' : 'disabled'}>Request it</button>
    </div>`;
  document.getElementById('back').onclick = () => { S.color = null; showCatalog(); };
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    S.color = b.dataset.c;
    app.querySelectorAll('.chip').forEach(x => x.classList.toggle('sel', x === b));
    document.getElementById('send').disabled = false;
  });
  document.getElementById('send').onclick = submit;
}

async function submit() {
  const btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = 'Sending…';
  const { data, error } = await db.rpc('submit_request', {
    p_item: S.item.id, p_color: S.color, p_code: S.code || null, p_source: SOURCE,
  });
  if (error) {
    const m = (error.message || '');
    if (m.includes('bad_code')) { S.code = ''; return showCode('That code didn’t match. Check the card by the sign.'); }
    if (m.includes('full')) return start();
    if (m.includes('closed')) return message('Taking a break', S.state.closed_message);
    if (m.includes('busy')) return message('Lots of requests right now!', 'The printer is booked up for today. Please try again tomorrow.');
    if (m.includes('bad_item') || m.includes('bad_color')) { S.item = null; S.color = null; return start(); }
    return showColor('Couldn’t send that. Check your connection and try again.');
  }
  bumpDevice();
  addClaim(data.claim);
  showDone(data.pickup_no, data.claim);
}

function showDone(n, claim) {
  const num = String(n).padStart(3, '0');
  setTimeout(() => confetti(false), 150);
  app.innerHTML = `
    <div class="card done">
      <div class="lbl">Your pickup number</div>
      <div class="num">#${num}</div>
      <div class="what">${esc(S.item.name)} &middot; ${esc(S.color)}</div>
      ${sectionOf(S.item) && sectionOf(S.item).ready_by ? `<div class="early" style="margin-top:14px">${esc(sectionOf(S.item).emoji || '')} Ready by ${esc(dueText(sectionOf(S.item).ready_by))}</div>` : ''}
      <p class="hint note">${esc(S.state.pickup_note)}</p>
      <div class="shot">This phone will remember it. Open this page any time to see when it&rsquo;s ready.</div>
      ${claim ? '<button class="btn ghost" id="save">Save a link to check from another device</button>' : ''}
      <button class="btn" id="again">Done</button>
    </div>`;
  document.getElementById('again').onclick = () => { S.item = null; S.color = null; start(); };
  const save = document.getElementById('save');
  if (save) save.onclick = async () => {
    const url = linkFor(claim);
    try {
      if (navigator.share) { await navigator.share({ title: 'My 3D print #' + num, url }); return; }
      await navigator.clipboard.writeText(url);
      save.textContent = 'Link copied!';
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      prompt('Copy this link:', url);
    }
  };
}

start();
</script>
