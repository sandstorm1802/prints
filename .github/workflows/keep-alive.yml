# Keeps the free Supabase project from pausing after 7 days of no activity.
# Runs every 3 days and asks the database for the request page's status
# (the same read-only lookup a visitor's phone makes). No data is changed.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 */3 * *"   # every 3 days, ~9:17 AM Eastern
  workflow_dispatch:          # "Run workflow" button for a manual ping

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://xmsfnoloijgvtlfvzmyb.supabase.co
          SUPABASE_KEY: sb_publishable_-BiThUOZZrxtoWV8T4eb6Q_1mOnfGWp
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_state" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer. The project may be paused; unpause it in the Supabase dashboard."
            exit 1
          fi
